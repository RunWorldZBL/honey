[package]
name = "honey"
version = "0.1.0"
description = "honey desktop shell"
authors = ["honey"]
edition = "2021"

[lib]
name = "honey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
